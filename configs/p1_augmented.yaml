# P1 — controlled comparison against configs/baseline_resnet50.yaml: identical
# in every hyperparameter except data.augment (see src/data/augmentations.py,
# docs/IMPLEMENTATION_PLAN.md's P1 section). Select between the two runs using
# internal val QWK only, before looking at external results again, then run
# external_eval exactly once on whichever wins.
run_id: p1_augmented_resnet50
seed: 42

data:
  train_csv: data/splits/train.csv
  val_csv: data/splits/val.csv
  image_root: data/processed
  image_size: 512
  augment: true

model:
  backbone: resnet50          # resnet50 | efficientnet_b0
  pretrained: true
  head: softmax                # softmax | coral (P2)
  num_classes: 5
  dropout: 0.3

train:
  epochs: 30
  batch_size: 16
  num_workers: 8
  optimizer: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  warmup_epochs: 2
  amp: true
  class_weighting: inverse_frequency
  grad_clip_norm: 1.0
  early_stop_patience: 8
  checkpoint_metric: qwk
  checkpoint_dir: reports/checkpoints/p1_augmented_resnet50

log:
  log_every_n_steps: 50
  confusion_matrix_every_epoch: true
